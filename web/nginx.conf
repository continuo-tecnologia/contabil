server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: same origin for the SPA, so the build needs no absolute URL (REACT_APP_API_URL=/api).
    # The trailing slash strips the /api prefix before handing the request to the API container.
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets (CRA adds content hashes to filenames)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
